[program:discord_app]
command=python3 -u /home/mesbot/main.py
directory=/home/mesbot/
user=mesbot
autostart=true
autorestart=true
; Survive planned DB maintenance. main.py exits immediately when the database is
; unreachable, so supervisor sees a failed start and counts it against startretries.
; The defaults (startsecs=1, startretries=3) gave up after ~16s and left the bot
; FATAL through the 2026-07-28 RDS maintenance window. Supervisor backs off linearly
; (1s, 2s, 3s, ...), so 60 retries spans roughly 30 minutes of downtime.
startsecs=10
startretries=60
stderr_logfile=/var/log/discord_app.log
stdout_logfile=/var/log/discord_app.log
redirect_stderr=true
